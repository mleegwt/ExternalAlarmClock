apply plugin: 'kotlin'
apply plugin: 'application'

application {
    mainClass = "com.externalalarmclock.alarmclock.AlarmClockApplicationKt"
}

project.ext {
    configPath = "$project.projectDir/src/dist/conf/"
}

run {
    args 'server', configPath + 'alarmclock.yml'
}

dependencies {
    implementation 'io.dropwizard:dropwizard-core:5.0.2'
    implementation 'com.google.guava:guava:33.7.1-jre'
    implementation project(':lib.externalalarmclock')
    implementation project(':lib.rpiws281x')
    implementation 'io.github.dropwizard-jobs:dropwizard-jobs-core:7.0.4'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
}

repositories {
  mavenLocal()
}

